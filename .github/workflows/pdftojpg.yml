name: PDF to Image and Zip

on:
  push:
    paths:
      - 'pdf/*.pdf'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pymupdf

      - name: Convert PDF to Images - 1 to 200 per zip
        shell: python
        run: |
          import fitz, zipfile
          from pathlib import Path
          import math

          pdf_dir = Path("pdf")
          out_base = Path("images")
          out_base.mkdir(parents=True, exist_ok=True)

          BATCH = 200  # 1-200 ek zip

          for pdf_file in pdf_dir.glob("*.pdf"):
              doc = fitz.open(pdf_file)
              pdf_name = pdf_file.stem
              total = len(doc)
              parts = math.ceil(total / BATCH)

              print(f"{pdf_name}: {total} pages -> {parts} zip")

              for p in range(parts):
                  start = p * BATCH
                  end = min(start + BATCH, total)

                  # temp image folder
                  tmp_dir = out_base / f"tmp_{pdf_name}_p{p+1}"
                  tmp_dir.mkdir(parents=True, exist_ok=True)

                  for i in range(start, end):
                      pix = doc[i].get_pixmap(dpi=300, alpha=False)
                      # short name: 0001.jpg
                      pix.save(str(tmp_dir / f"{i+1:04d}.jpg"), jpg_quality=95)

                  # zip name: pdf1.zip = 1-200, pdf1_p2.zip = 201-400
                  if parts == 1:
                      zip_name = f"{pdf_name}.zip"
                  else:
                      zip_name = f"{pdf_name}_p{p+1}.zip" if p > 0 else f"{pdf_name}.zip"

                  zip_path = out_base / zip_name
                  with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as z:
                      for img in sorted(tmp_dir.glob("*.jpg")):
                          z.write(img, img.name)

                  # temp folder delete kore dao
                  for f in tmp_dir.glob("*"): f.unlink()
                  tmp_dir.rmdir()

                  print(f" -> Created {zip_name} [ {start+1} to {end} ]")

              doc.close()

      - name: Create matrix
        id: set-matrix
        run: |
          cd images
          MATRIX=$(ls *.zip | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

      - name: Temp upload
        uses: actions/upload-artifact@v4
        with:
          name: temp-zips
          path: images/*.zip

  # PROTITA ZIP ALADA ARTIFACT HOBE
  upload-separate:
    needs: convert
    runs-on: ubuntu-latest
    strategy:
      matrix:
        zipfile: ${{ fromJson(needs.convert.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: temp-zips
          path: zips

      - name: Upload ${{ matrix.zipfile }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zipfile }}
          path: zips/${{ matrix.zipfile }}
          retention-days: 7
