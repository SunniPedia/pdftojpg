name: OCR Bangla-Arabic Pages

on:
  workflow_dispatch:
    inputs:
      page_from:
        description: "শুরুর পেইজ নম্বর (যেমন 501)"
        required: true
        type: string
      page_to:
        description: "শেষ পেইজ নম্বর (যেমন 520)"
        required: true
        type: string

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # GitHub free-tier single-job সর্বোচ্চ সীমার কাছাকাছি; পেইজ বেশি হলে রেঞ্জ ছোট করে বারবার চালান
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # EasyOCR মডেল ওজন (~ কয়েকশ MB) প্রতিবার ডাউনলোড না করতে cache
      - name: Cache EasyOCR models
        uses: actions/cache@v4
        with:
          path: ~/.EasyOCR
          key: easyocr-models-bn-ar-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install easyocr pillow

      - name: Run OCR pipeline
        run: |
          python scripts/ocr_pipeline.py \
            --img-dir img \
            --page-from "${{ inputs.page_from }}" \
            --page-to "${{ inputs.page_to }}" \
            --output "output/${{ inputs.page_from }}-${{ inputs.page_to }}.txt"

      - name: Upload output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocr-output-${{ inputs.page_from }}-${{ inputs.page_to }}
          path: output/${{ inputs.page_from }}-${{ inputs.page_to }}.txt

      # চাইলে output ফাইলটা সরাসরি রিপোতে commit করেও রাখতে পারেন (না চাইলে এই স্টেপ বাদ দিন)
      - name: Commit output to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "output/${{ inputs.page_from }}-${{ inputs.page_to }}.txt"
          git commit -m "OCR output: pages ${{ inputs.page_from }}-${{ inputs.page_to }}" || echo "কোনো পরিবর্তন নেই, কমিট স্কিপ করা হলো"
          git push
