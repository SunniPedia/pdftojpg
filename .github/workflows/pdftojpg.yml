name: PDF to Image and Zip

on:
  push:
    paths:
      - 'pdf/*.pdf'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install PyMuPDF Pillow

      - name: Convert PDF to Images (300 DPI - No Box Issue)
        run: |
          import fitz
          import os
          import zipfile
          from pathlib import Path

          pdf_dir = Path("pdf")
          output_base = Path("images")
          output_base.mkdir(exist_ok=True)

          # pdf folder e thaka sob pdf
          for pdf_file in pdf_dir.glob("*.pdf"):
              print(f"Processing: {pdf_file}")
              doc = fitz.open(pdf_file)
              pdf_name = pdf_file.stem
              out_dir = output_base / pdf_name
              out_dir.mkdir(exist_ok=True)
              
              for i, page in enumerate(doc):
                  # 300 DPI te render - box asbe na, font thik thakbe
                  pix = page.get_pixmap(dpi=300)
                  pix.save(str(out_dir / f"{pdf_name}_page-{i+1:04d}.png"))
              
              # Zip create
              zip_path = output_base / f"{pdf_name}_images.zip"
              with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as zipf:
                  for img_file in out_dir.rglob("*.png"):
                      zipf.write(img_file, img_file.relative_to(output_base))
              
              print(f"Created: {zip_path}")

          # Sob image ek sathe ekta full zip
          with zipfile.ZipFile("images/all_images.zip", 'w', zipfile.ZIP_DEFLATED) as zipf:
              for file in output_base.rglob("*.png"):
                  zipf.write(file, file.relative_to(output_base))
        shell: python

      - name: Upload Zip as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: converted-images-zip
          path: |
            images/*.zip
            images/**/*.zip
          retention-days: 7

      - name: Commit images back to repo (optional)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add images/
          git diff --staged --quiet || git commit -m "Auto: PDF to Image converted [300 DPI]"
          git push
        continue-on-error: true
