name: PDF to Image and Zip

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --upgrade pymupdf

      - name: Convert PDF to Images - 1 to 200 per zip (max 500KB per image)
        shell: python
        run: |
          import pymupdf
          import zipfile
          from pathlib import Path
          import math

          pdf_dir = Path("pdf")
          out_base = Path("images")
          out_base.mkdir(parents=True, exist_ok=True)

          BATCH = 200  # 1-200 ek zip
          MAX_SIZE_BYTES = 500 * 1024  # 500KB

          for pdf_file in pdf_dir.glob("*.pdf"):
              doc = pymupdf.open(pdf_file)
              pdf_name = pdf_file.stem
              total = len(doc)
              parts = math.ceil(total / BATCH)

              print(f"{pdf_name}: {total} pages -> {parts} zip")

              for p in range(parts):
                  start = p * BATCH
                  end = min(start + BATCH, total)

                  tmp_dir = out_base / f"tmp_{pdf_name}_p{p+1}"
                  tmp_dir.mkdir(parents=True, exist_ok=True)

                  for i in range(start, end):
                      dpi = 300
                      quality = 95
                      output_path = tmp_dir / f"{i+1:04d}.jpg"
                      page = doc.load_page(i)

                      while True:
                          pix = page.get_pixmap(dpi=dpi, alpha=False)
                          img_bytes = pix.tobytes("jpg", jpg_quality=quality)

                          if len(img_bytes) <= MAX_SIZE_BYTES:
                              output_path.write_bytes(img_bytes)
                              print(f"  Page {i+1}: {len(img_bytes)/1024:.1f}KB [dpi={dpi}, q={quality}]")
                              break
                          
                          if quality > 35:
                              quality -= 5
                          elif dpi > 150:
                              dpi -= 25
                              quality = 85
                          else:
                              # 150 dpi + 30 quality teo boro hole ja ache tai save
                              output_path.write_bytes(img_bytes)
                              print(f"  Page {i+1}: WARN {len(img_bytes)/1024:.1f}KB >500KB, saved at min")
                              break

                  # zip name: pdf1.zip = 1-200, pdf1_p2.zip = 201-400
                  if parts == 1:
                      zip_name = f"{pdf_name}.zip"
                  else:
                      zip_name = f"{pdf_name}_p{p+1}.zip" if p > 0 else f"{pdf_name}.zip"

                  zip_path = out_base / zip_name
                  with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as z:
                      for img in sorted(tmp_dir.glob("*.jpg")):
                          z.write(img, img.name)

                  # temp folder delete
                  for f in tmp_dir.glob("*"): f.unlink()
                  tmp_dir.rmdir()

                  print(f" -> Created {zip_name} [ {start+1} to {end} ]")

              doc.close()

      - name: Create matrix
        id: set-matrix
        run: |
          cd images
          MATRIX=$(ls *.zip | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

      - name: Temp upload
        uses: actions/upload-artifact@v4
        with:
          name: temp-zips
          path: images/*.zip

  # PROTITA ZIP ALADA ARTIFACT HOBE
  upload-separate:
    needs: convert
    runs-on: ubuntu-latest
    strategy:
      matrix:
        zipfile: ${{ fromJson(needs.convert.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: temp-zips
          path: zips

      - name: Upload ${{ matrix.zipfile }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zipfile }}
          path: zips/${{ matrix.zipfile }}
          retention-days: 7
